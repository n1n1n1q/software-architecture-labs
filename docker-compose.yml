services:
  config-server:
    build:
      context: ./app
      dockerfile: config.Dockerfile
    container_name: config-server
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_BALANCE_UPDATES_TOPIC: balance-updates
      KAFKA_BALANCE_UPDATES_GROUP: counter-service
      HAZELCAST_CLUSTER_NAME: hello-world
      HAZELCAST_MEMBERS: hz-node1:5701,hz-node2:5701,hz-node3:5701
      HAZELCAST_MAP_NAME: transactions-map
    ports:
      - "8500:8500"

  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT_HOST://0.0.0.0:9092,PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qg
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  hz-node1:
    image: hazelcast/hazelcast:5.6.0
    container_name: hz-node1
    ports:
      - "5701:5701"
    volumes:
      - ./hazelcast.xml:/opt/hazelcast/config/hazelcast-docker.xml
    environment:
      - HZ_CLUSTERNAME=hello-world
      - HZ_NETWORK_PUBLICADDRESS=hz-node1:5701

  hz-node2:
    image: hazelcast/hazelcast:5.6.0
    container_name: hz-node2
    ports:
      - "5702:5701"
    volumes:
      - ./hazelcast.xml:/opt/hazelcast/config/hazelcast-docker.xml
    environment:
      - HZ_CLUSTERNAME=hello-world
      - HZ_NETWORK_PUBLICADDRESS=hz-node2:5701

  hz-node3:
    image: hazelcast/hazelcast:5.6.0
    container_name: hz-node3
    ports:
      - "5703:5701"
    volumes:
      - ./hazelcast.xml:/opt/hazelcast/config/hazelcast-docker.xml
    environment:
      - HZ_CLUSTERNAME=hello-world
      - HZ_NETWORK_PUBLICADDRESS=hz-node3:5701

  logging-service-1:
    build:
      context: ./app
      dockerfile: logging.Dockerfile
    container_name: logging-service-1
    environment:
      LOGGING_INSTANCE_ID: logging-service-1
      LOGGING_GRPC_PORT: 50051
      SELF_ADDRESS: logging-service-1:50051
      CONFIG_SERVER_URL: http://config-server:8500
    ports:
      - "50051:50051"
    depends_on:
      - config-server
      - hz-node1
      - hz-node2
      - hz-node3

  logging-service-2:
    build:
      context: ./app
      dockerfile: logging.Dockerfile
    container_name: logging-service-2
    environment:
      LOGGING_INSTANCE_ID: logging-service-2
      LOGGING_GRPC_PORT: 50051
      SELF_ADDRESS: logging-service-2:50051
      CONFIG_SERVER_URL: http://config-server:8500
    ports:
      - "50052:50051"
    depends_on:
      - config-server
      - hz-node1
      - hz-node2
      - hz-node3

  logging-service-3:
    build:
      context: ./app
      dockerfile: logging.Dockerfile
    container_name: logging-service-3
    environment:
      LOGGING_INSTANCE_ID: logging-service-3
      LOGGING_GRPC_PORT: 50051
      SELF_ADDRESS: logging-service-3:50051
      CONFIG_SERVER_URL: http://config-server:8500
    ports:
      - "50053:50051"
    depends_on:
      - config-server
      - hz-node1
      - hz-node2
      - hz-node3

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_DB: counterdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  counter-service:
    build:
      context: ./app
      dockerfile: counter.Dockerfile
    container_name: counter-service
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/counterdb
      INSTANCE_ID: counter-service-1
      HTTP_PORT: 8001
      SELF_ADDRESS: http://counter-service:8001
      CONFIG_SERVER_URL: http://config-server:8500
    ports:
      - "8001:8001"
    depends_on:
      config-server:
        condition: service_started
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy

  facade-service:
    build:
      context: ./app
      dockerfile: facade.Dockerfile
    container_name: facade-service
    environment:
      INSTANCE_ID: facade-service-1
      HTTP_PORT: 8002
      SELF_ADDRESS: http://facade-service:8002
      CONFIG_SERVER_URL: http://config-server:8500
      LOGGING_SERVICE_NAME: logging-service
      COUNTER_SERVICE_NAME: counter-service
    ports:
      - "8002:8002"
    depends_on:
      config-server:
        condition: service_started
      kafka:
        condition: service_healthy
      logging-service-1:
        condition: service_started
      logging-service-2:
        condition: service_started
      logging-service-3:
        condition: service_started

volumes:
  postgres_data:
