apiVersion: apps/v1
kind: Deployment
metadata:
  name: facade-service
  namespace: micro-lab5
spec:
  replicas: 2
  selector:
    matchLabels:
      app: facade-service
  template:
    metadata:
      labels:
        app: facade-service
    spec:
      serviceAccountName: microservices-sa
      containers:
        - name: facade-service
          image: software-architecture-labs/facade-service:lab5
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8002
          env:
            - name: SERVICE_NAME
              value: facade-service
            - name: APP_CONFIGMAP_NAME
              value: microservices-config
            - name: HTTP_PORT
              value: "8002"
            - name: INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: LOGGING_SERVICE_NAME
              value: logging-service
            - name: LOGGING_SERVICE_PORT_NAME
              value: grpc
            - name: COUNTER_SERVICE_NAME
              value: counter-service
            - name: COUNTER_SERVICE_PORT_NAME
              value: http
            - name: FACADE_SERVICE_PORT_NAME
              value: http
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: facade-service
  namespace: micro-lab5
spec:
  selector:
    app: facade-service
  ports:
    - name: http
      protocol: TCP
      port: 8002
      targetPort: http
