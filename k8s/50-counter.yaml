apiVersion: apps/v1
kind: Deployment
metadata:
  name: counter-service
  namespace: micro-lab5
spec:
  replicas: 2
  selector:
    matchLabels:
      app: counter-service
  template:
    metadata:
      labels:
        app: counter-service
    spec:
      serviceAccountName: microservices-sa
      containers:
        - name: counter-service
          image: software-architecture-labs/counter-service:lab5
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8001
          env:
            - name: SERVICE_NAME
              value: counter-service
            - name: APP_CONFIGMAP_NAME
              value: microservices-config
            - name: HTTP_PORT
              value: "8001"
            - name: INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: microservices-secrets
                  key: DATABASE_URL
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: counter-service
  namespace: micro-lab5
spec:
  selector:
    app: counter-service
  ports:
    - name: http
      protocol: TCP
      port: 8001
      targetPort: http
